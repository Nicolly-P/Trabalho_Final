<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Interativo</title>
<link rel="stylesheet" href="pagporta.css">

<script>
        if (new URLSearchParams(window.location.search).get("fadein") === "1") {
            document.documentElement.classList.add("fade-in-historia");
        }
    </script>

</head>

<body>

    <!-- MÚSICA DE FUNDO -->
    <audio id="musicaFundo" loop style="display:none;">
        <source src="midia/audio.mp3" type="audio/mpeg">
    </audio>

<!-- CENÁRIO -->
<div id="cenario">

<!-- PAINEL DA PORTA -->
<button type="button"
    class="quadro-botao"
    onclick="abrirPainel()">

    <img src="painel.png" alt="Painel da porta">

</button>

<!-- FLOR NO CHÃO -->
<img src="flor.png"
    class="flor-cenario"
    alt="Flor no cenário">

<!-- PAPEL PERTO DA PLANTA -->
<button type="button"
        class="papel-botao"
        onclick="abrirPapel()">

    <img src="papel.png" alt="Anotação">

</button>

</div>

<!-- PAINEL AMPLIADO -->
<div class="overlay" id="quadroOverlay">

<div class="quadro-grande-wrapper">

    <img src="painel.png"
        class="quadro-grande"
        alt="Painel ampliado">

    <!-- VISOR -->
    <input id="visor"
    type="text"
    readonly
    maxlength="6">

    <!-- NÚMEROS -->
    <button type="button" class="numero n1" onclick="digitar('1')"></button>
    <button type="button" class="numero n2" onclick="digitar('2')"></button>
    <button type="button" class="numero n3" onclick="digitar('3')"></button>

    <button type="button" class="numero n4" onclick="digitar('4')"></button>
    <button type="button" class="numero n5" onclick="digitar('5')"></button>
    <button type="button" class="numero n6" onclick="digitar('6')"></button>

    <button type="button" class="numero n7" onclick="digitar('7')"></button>
    <button type="button" class="numero n8" onclick="digitar('8')"></button>
    <button type="button" class="numero n9" onclick="digitar('9')"></button>

    <button type="button" class="numero n0" onclick="digitar('0')"></button>

</div>

<!-- FECHAR PAINEL -->
<button type="button"
    class="botao-fechar"
    onclick="fecharPainel()"
    aria-label="Fechar painel"> × </button>

</div>

<!-- PAPEL AMPLIADO (MESMA IMAGEM) -->
<div class="papel-overlay" id="papelOverlay">

<img src="papel.png"
    class="papel-grande"
    alt="Anotação ampliada">

<!-- FECHAR PAPEL -->
<button type="button"
        class="papel-fechar"
        onclick="fecharPapel()"> × </button>

</div>

    <script src="script.js"></script>
    <script src="scriptporta.js"></script>
    <script src="musica.js"></script>
    <script src="configuracoes.js"></script>

</body>
</html>
