<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Glória</title>
    <link rel="stylesheet" href="stylehistoria.css">
    <link rel="stylesheet" href="stylehistoria.css">

<script>
    if (new URLSearchParams(window.location.search).get("fadein") === "1") {
        document.documentElement.classList.add("fade-in-historia");
    }
</script>
</head>

<body>

    <!-- MÚSICA DE FUNDO -->
<audio id="musicaFundo" loop style="display:none;">
    <source src="midia/audio.mp3" type="audio/mpeg">
</audio>

    <!-- TELA DA HISTÓRIA -->
    <div class="tela-historia">

        <main class="game">

        <!-- CENÁRIO -->
        <img src="midia/cenariouniforme.png" class="cenario" alt="Sala das enfermeiras" >

        <!-- =====================================
            ARMÁRIO 3
        ====================================== -->
        <div class="armario-container">

            <!-- ARMÁRIO FECHADO -->
            <img src="midia/armario.png" class="armario" id="armarioFechado" alt="Armário 3" >

            <!-- ARMÁRIO ABERTO -->
            <img src="midia/armarioaber.png" class="armario armario-aberto" id="armarioAberto" alt="Armário 3 aberto" >

            <!-- CADEADO -->
            <button class="cadeado-botao" id="abrirCadeado" type="button" >
                <img src="midia/cadeado.png" class="cadeado" alt="Cadeado do Armário 3">
            </button>

            <!-- UNIFORME -->
            <button class="uniforme-botao" id="pegarUniforme" type="button" >
                <img src="midia/uniforme.png" class="uniforme" alt="Uniforme de enfermeira">
            </button>

        </div>

        <!-- =====================================
            QUADRO
        ====================================== -->
        <button class="quadro-botao" id="abrirQuadro" type="button" >
            <img src="quadro.png" class="quadro" alt="Quadro de investigação">

            <img src="midia/papel.png" class="papel-no-quadro-sala" alt="">

        </button>


        <!-- =====================================
            ZOOM DO QUADRO
        ====================================== -->
        <div
            class="overlay"
            id="quadroOverlay">

            <button class="botao-fechar" id="fecharQuadro" type="button" aria-label="Fechar quadro"> × </button>

            <div class="quadro-grande-wrapper">
                <img src="quadro.png" class="quadro-grande" alt="Quadro de investigação ampliado">

                <!-- PAPEL CLICÁVEL -->
                <button class="papel-botao" id="abrirPapel "type="button">
                    <img src="midia/papel.png" class="papel-no-quadro" alt="Papel">
                </button>

            </div>
        </div>


        <!-- =====================================
            ZOOM DO PAPEL
        ====================================== -->
        <div class="overlay papel-overlay" id="papelOverlay">

            <button class="botao-fechar" id="fecharPapel" type="button" aria-label="Fechar papel" > × </button>
            <img src="midia/papel.png" class="papel-grande" alt="Papel ampliado">
        </div>


        <!-- =====================================
            CADEADO / COMBINAÇÃO
        ====================================== -->
        <div class="overlay cadeado-overlay" id="cadeadoOverlay">
            <button class="botao-fechar" id="fecharCadeado" type="button" aria-label="Fechar cadeado" > × </button>
            <div class="cadeado-painel">

                <h2>CADEADO</h2>
                <p class="instrucao">
                    Arraste os discos para cima ou para baixo
                </p>
                <div class="cadeado-discos">

                    <!-- DISCO 1 -->
                    <div class="disco-arrastavel" data-numero="0" >
                        <div class="numeros">
                            <span>0</span>
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                        </div>

                        <div class="linha-superior"></div>
                        <div class="linha-inferior"></div>

                    </div>


                    <!-- DISCO 2 -->
                    <div class="disco-arrastavel" data-numero="0">

                        <div class="numeros">
                            <span>0</span>
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                        </div>

                        <div class="linha-superior"></div>
                        <div class="linha-inferior"></div>

                    </div>


                    <!-- DISCO 3 -->
                    <div class="disco-arrastavel" data-numero="0">

                        <div class="numeros">
                            <span>0</span>
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                        </div>

                        <div class="linha-superior"></div>
                        <div class="linha-inferior"></div>

                    </div>
                </div>


                <!-- SENHA ATUAL -->
                <div class="senha-atual" id="senhaAtual"> 000 </div>


                <!-- MENSAGEM DO CADEADO -->
                <div class="mensagem-cadeado" id="mensagemCadeado"></div>

            </div>

        </div>


        <!-- =====================================
            MENSAGEM DO JOGO
        ====================================== -->
        <div class="mensagem-jogo" id="mensagemJogo"></div>

    </main>

    <!-- JavaScript -->
    <script src="scripthistoria.js"></script>
    <script src="script.js"></script>
    <script src="musica.js"></script>

</body>

</html>
