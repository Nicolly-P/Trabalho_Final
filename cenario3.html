<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Glória - Cenario 3</title>

    <link rel="stylesheet" href="../css/cenario3.css">

    <script>
        if (new URLSearchParams(window.location.search).get("fadein") === "1") {
            document.documentElement.classList.add("fade-in-historia");
        }
    </script>
</head>
<body>

    <!-- MÚSICA DE FUNDO -->
    <audio id="musicaFundo" loop style="display: none;">
        <source src="../assets/audio/audio.mp3" type="audio/mpeg">
    </audio>

    <!-- CENÁRIO -->
    <div id="cenario">

        <!-- CADERNO RATO -->
        <button type="button" class="caderno-rato"
            onclick="abrirCadernoRato()">

            <img src="../assets/imagens/caderno.png"
                 alt="Caderno Rato">
        </button>

        <!-- CADERNO CADEADO -->
        <button type="button" class="caderno-cadeado"
            onclick="abrirCadernoCadeado()">

            <img src="../assets/imagens/cadernocadeado.png"
                 alt="Caderno Cadeado">
        </button>

        <img src="../assets/imagens/amarelo.png"
             class="amarelo"
             alt="Flor amarela">

    </div>

    <!-- OBJETIVOS DO JOGO -->
    <div class="objetivos-container">

        <div class="objetivo-jogo" id="objetivoJogo">

            <div class="objetivo-cabecalho">
                <span>OBJETIVO</span>

                <button type="button"
                    id="minimizarObjetivo"
                    aria-label="Minimizar objetivo">−</button>
            </div>

            <p>Descubra qual a senha para abrir o caderno.</p>
        </div>

        <div class="objetivo-aba" id="abaObjetivo">
            OBJETIVO +
        </div>

    </div>

    <!-- INTERFACE DE DIÁLOGO -->
    <div id="interfaceDialogo" class="interface-dialogo">

        <img src=""
             alt=""
             id="imagemPersonagem"
             class="imagem-personagem">

        <div class="caixa-dialogo">
            <div class="nome-personagem">Personagem</div>
            <div class="texto-dialogo"></div>

            <div class="indicador-dialogo">
                Clique ou pressione ENTER para continuar ▼
            </div>
        </div>
    </div>

    <!-- CADERNO CADEADO AMPLIADO -->
    <div class="overlay" id="cadernocadeadoOverlay">

        <div class="cadernocadeado-grande-wrapper">

            <img src="../assets/imagens/cadernocadeadoampliado.png"
                 class="cadernocadeado-grande"
                 alt="Caderno cadeado ampliado">

            <div class="cadeado-container">

                <div class="roldanas">

                    <div class="roldana">
                        <button type="button"
                            onclick="girarRoldana(0, -1)"
                            aria-label="Diminuir primeiro número">
                            ▲
                        </button>

                        <div class="numero-roldana" id="roldana0">0</div>

                        <button type="button"
                            onclick="girarRoldana(0, 1)"
                            aria-label="Aumentar primeiro número">
                            ▼
                        </button>
                    </div>

                    <div class="roldana">
                        <button type="button"
                            onclick="girarRoldana(1, -1)"
                            aria-label="Diminuir segundo número">
                            ▲
                        </button>

                        <div class="numero-roldana" id="roldana1">0</div>

                        <button type="button"
                            onclick="girarRoldana(1, 1)"
                            aria-label="Aumentar segundo número">
                            ▼
                        </button>
                    </div>

                    <div class="roldana">
                        <button type="button"
                            onclick="girarRoldana(2, -1)"
                            aria-label="Diminuir terceiro número">
                            ▲
                        </button>

                        <div class="numero-roldana" id="roldana2">0</div>

                        <button type="button"
                            onclick="girarRoldana(2, 1)"
                            aria-label="Aumentar terceiro número">
                            ▼
                        </button>
                    </div>

                </div>

                <button type="button"
                    class="botao-verificar"
                    onclick="verificarCombinacao()">
                    VERIFICAR
                </button>

                <p id="mensagemCadeado"></p>

            </div>

            <button type="button"
                class="botao-fechar"
                onclick="fecharCadernoCadeado()"
                aria-label="Fechar caderno">
                ×
            </button>

        </div>
    </div>

    <!-- CARROSSEL DAS PÁGINAS DO CADERNO -->
<div class="paginas-overlay" id="paginasOverlay">

    <div class="carrossel">

        <!-- BOTÃO PÁGINA ANTERIOR -->
        <button type="button"
            class="carrossel-btn anterior"
            id="botaoAnterior"
            onclick="mudarPagina(-1)"
            aria-label="Página anterior">
            &#10094;
        </button>

        <!-- ÁREA FIXA DAS IMAGENS -->
        <div class="pagina-container">

            <img src="../assets/imagens/cadernoampliado.png"
                 id="imagemPagina"
                 alt="Página do caderno">

        </div>

        <!-- BOTÃO PRÓXIMA PÁGINA -->
        <button type="button"
            class="carrossel-btn proximo"
            id="botaoProximo"
            onclick="mudarPagina(1)"
            aria-label="Próxima página">
            &#10095;
        </button>

        <!-- CONTADOR -->
        <div class="contador-paginas" id="contadorPaginas">
            1 / 5
        </div>

    </div>

    <!-- BOTÃO FECHAR -->
    <button type="button"
        class="rato-fechar"
        onclick="fecharPaginas()"
        aria-label="Fechar páginas">
        ×
    </button>

</div>
    <!-- NOVO CADERNO DESBLOQUEADO -->
    <div class="overlay" id="cadernoDesbloqueadoOverlay">

        <div class="caderno-desbloqueado-wrapper">

            <img src="../assets/imagens/caderno_aberto.png"
                 class="caderno-desbloqueado-grande"
                 alt="Novo caderno desbloqueado">

            <img src="../assets/imagens/cartafechada.png"
                 class="carta-fechada"
                 alt="Carta fechada"
                 onclick="abrirCarta()">

            <button type="button"
                class="botao-fechar"
                onclick="fecharCadernoDesbloqueado()"
                aria-label="Fechar novo caderno">
                ×
            </button>

        </div>
    </div>

    <!-- CARTA ABERTA -->
    <div class="overlay" id="cartaabertaOverlay">

        <div class="carta-aberta-wrapper">

            <img src="../assets/imagens/cartaaberta.png"
                 class="carta-aberta"
                 alt="Carta aberta">

            <button type="button"
                class="botao-fechar"
                onclick="fecharCartaAberta()"
                aria-label="Fechar carta">
                ×
            </button>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../js/sistemas/musica.js"></script>
    <script src="../js/sistemas/configuracoes.js"></script>
    <script src="../js/cenario3/dialogo3.js"></script>
    <script src="../js/historia/objetivos.js"></script>
    <script src="../js/cenario3/caderno.js"></script>

</body>
</html>
